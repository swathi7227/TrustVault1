requires-python = ">=3.12"
dependencies = [
    "fastapi==0.161.1",
    "uvicorn==0.54.0",
    "SQLAlchemy==2.1.6",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.16.1",
